<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品集加载检查</title><style>body{font:18px/1.8 -apple-system,BlinkMacSystemFont,sans-serif;padding:24px;margin:0;color:#162d51}h1{font-size:25px}li{margin:16px 0}a{color:#164a85}#status{font-weight:600}</style><h1>作品集加载检查</h1><p>这个页面只测试下载，不运行动效。约12秒后显示结果。</p><ul id="results"></ul><p id="status">检查中…</p><p><a href="/?v=original-inlinecss">打开原版作品集</a></p><script>
const jobs=[["页面样式", "/assets/index-DKNbmSQc.css"], ["页面程序", "/assets/index-AzMheu8t.js"], ["动效程序", "/assets/WarpText-D8NUJCto.js"], ["项目图片", "/projects/pdd-browse-filter/optimized/page-01-1440.03fbb031c8fd.webp"]];const list=document.getElementById('results');const times=[];Promise.all(jobs.map(async([name,url])=>{const li=document.createElement('li');li.textContent=name+'：检查中';list.append(li);const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000),start=performance.now();try{const r=await fetch(url,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error();await r.arrayBuffer();const t=(performance.now()-start)/1000;times.push(t);li.textContent=name+'：'+t.toFixed(1)+'秒';}catch{times.push(99);li.textContent=name+'：超时或未能连接';}finally{clearTimeout(timer)}})).then(()=>document.getElementById('status').textContent=Math.max(...times)>5?'结果：资源下载较慢':'结果：资源下载正常');
