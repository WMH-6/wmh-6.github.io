<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>一起聊聊 · MH</title>
    <link rel="icon" href="/mh-favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', sans-serif; background: #000; color: #f5f5f5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100svh; background: #000; }
      .qr-nav { position: absolute; z-index: 1; inset: 28px 36px auto; display: flex; align-items: center; justify-content: space-between; max-width: 1600px; margin-inline: auto; }
      .qr-brand { font-size: 11px; letter-spacing: .22em; color: #ffffff70; }
      .icon-button { display: grid; width: 46px; height: 46px; place-items: center; padding: 0; border: 1px solid #ffffff26; border-radius: 50%; background: #ffffff05; color: #f5f5f5; cursor: pointer; text-decoration: none; transition: color .2s, background .2s, border-color .2s; -webkit-tap-highlight-color: transparent; }
      .icon-button svg { width: 20px; height: 20px; }
      .icon-button:hover { background: #fff; color: #000; border-color: #fff; }
      .icon-button:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
      main { display: flex; min-height: 100svh; flex-direction: column; align-items: center; justify-content: center; padding: 110px 24px 48px; }
      h1 { margin: 0 0 24px; font-size: clamp(20px, 2vw, 26px); font-weight: 400; letter-spacing: .04em; }
      .qr-image { display: block; width: min(380px, calc((100svh - 205px) * .78515), 100%); height: auto; border: 1px solid #ffffff26; border-radius: 18px; background: #fff; }
      @media (max-width: 767px) { .qr-nav { inset: max(20px, env(safe-area-inset-top)) 20px auto; } main { padding: 104px 30px 42px; } .qr-image { width: min(380px, calc((100svh - 190px) * .78515), 100%); } }
      @media (prefers-reduced-motion: reduce) { .icon-button { transition: none; } }
    </style>
  </head>
  <body>
    <nav class="qr-nav" aria-label="页面导航">
      <button class="icon-button" id="go-back" type="button" aria-label="返回上一页" title="返回上一页">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <span class="qr-brand" aria-hidden="true">MH / LET’S TALK</span>
      <a class="icon-button" href="/#top" aria-label="返回首页" title="返回首页">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </a>
    </nav>
    <main>
      <h1>一起聊聊</h1>
      <img class="qr-image" src="/wechat-qr-green.jpg" width="888" height="1131" alt="文明辉的微信二维码，微信扫一扫添加好友" />
    </main>
    <script>
      document.getElementById('go-back').addEventListener('click', () => {
        const fromSite = document.referrer && new URL(document.referrer).origin === location.origin
        if (fromSite && history.length > 1) history.back()
        else location.assign('/#top')
      })
    </script>
  </body>
</html>
