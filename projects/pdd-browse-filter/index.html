    <style>

      @media (max-width: 767px) { .case-header { height: 64px; padding: 0 12px; gap: 8px; } .reader { height: calc(100svh - 64px); padding: 12px 0 24px; } .case-pages { width: 100%; } .case-actions { gap: 6px; } }

      <p id="status" class="sr-only" role="status">正在打开项目…</p>
      <div id="case-pages" class="case-pages"><figure class="case-page" id="page-01" data-page="0" aria-label="原稿第 1 页" style="aspect-ratio: 4320.0 / 2430.0"><img src="optimized/page-01-1440.03fbb031c8fd.webp" srcset="optimized/page-01-720.3c6107792934.webp 720w, optimized/page-01-1440.03fbb031c8fd.webp 1440w, optimized/page-01-2160.d66207a3f433.webp 2160w" sizes="(max-width: 767px) 100vw, (min-width: 1648px) 1600px, calc(100vw - 48px)" width="3000" height="1688" style="height: 100.0%" alt="拼多多浏览筛选体验升级，原稿第 1 页" decoding="async" fetchpriority="high" data-mode="preview" /></figure></div>

    <script>
const reader = document.getElementById('reader')
const pages = document.getElementById('case-pages')
const pageSelect = document.getElementById('page-select')
const zoomToggle = document.getElementById('zoom-toggle')
const status = document.getElementById('status')
let currentPage = 0
let originalSize = false
let pageElements = []
let imageEntries = []
let nearPages
const imageSizes = '(max-width: 767px) 100vw, (min-width: 1648px) 1600px, calc(100vw - 48px)'

function loadPage(index, priority = 'low') {
  const entry = imageEntries[index]
  if (!entry) return
  const { image, page } = entry
  const mode = originalSize ? 'original' : 'preview'
  if (image.dataset.mode === mode) return
  image.fetchPriority = priority
  image.loading = 'eager'
  if (!originalSize && page.preview) {
    image.sizes = imageSizes
    image.srcset = page.preview.srcSet
    image.src = page.preview.src
  } else {
    image.removeAttribute('srcset')
    image.removeAttribute('sizes')
    image.src = page.src
  }
  image.dataset.mode = mode
}
const jumpToPage = index => {
  loadPage(index, 'high')
  pageElements[index]?.scrollIntoView({ block: 'start', inline: 'center', behavior: 'instant' })
}
document.getElementById('back-to-works').addEventListener('click', event => {
  if (!document.referrer || history.length < 2) return
  const previous = new URL(document.referrer)
  if (previous.origin === location.origin && previous.pathname === '/') { event.preventDefault(); history.back() }
})
pageSelect.addEventListener('change', () => jumpToPage(Number(pageSelect.value)))
zoomToggle.addEventListener('click', () => {
  originalSize = pages.classList.toggle('is-actual-size')
  zoomToggle.setAttribute('aria-pressed', String(originalSize))
  const label = originalSize ? '适应窗口宽度' : '原尺寸放大查看'
  zoomToggle.setAttribute('aria-label', label)
  zoomToggle.title = label
  nearPages?.disconnect()
  pageElements.forEach(element => nearPages?.observe(element))
  requestAnimationFrame(() => jumpToPage(currentPage))
})
const openProject = async () => {
  try {
    const response = await fetch('./manifest.json', { priority: 'high' })
    if (!response.ok) throw new Error('manifest')
    const manifest = await response.json()
    if (manifest.pages.length !== manifest.pageCount || !manifest.pageCount) throw new Error('pages')
    const fragment = document.createDocumentFragment()
    pageSelect.replaceChildren()
    manifest.pages.forEach((page, index) => {
      const id = `page-${String(page.number).padStart(2, '0')}`
      const figure = document.getElementById(id) || document.createElement('figure')
      figure.className = 'case-page'
      figure.id = id
      figure.dataset.page = String(index)
      figure.style.aspectRatio = `${page.pageWidth} / ${page.pageHeight}`
      figure.setAttribute('aria-label', `原稿第 ${page.number} 页`)
      const image = figure.querySelector('img') || document.createElement('img')
      image.alt = `${manifest.title}，原稿第 ${page.number} 页`
      image.width = page.width
      image.height = page.height
      image.style.height = `${page.drawHeight / page.pageHeight * 100}%`
      image.decoding = 'async'
      image.addEventListener('error', () => figure.classList.add('has-error'))
      figure.append(image)
      fragment.append(figure)
      imageEntries.push({ image, page })
      pageElements.push(figure)
      const option = document.createElement('option')
      option.value = String(index)
      option.textContent = `${String(page.number).padStart(2, '0')} / ${manifest.pageCount}`
      pageSelect.append(option)
    })
    pages.append(fragment)
    status.remove()
    pageSelect.disabled = false
    zoomToggle.disabled = false
    // Prepare the next screens before they are reached, without downloading
    // every full-resolution original when the reader is first opened.
    nearPages = new IntersectionObserver(entries => {
      for (const entry of entries) if (entry.isIntersecting) loadPage(Number(entry.target.dataset.page))
    }, { root: reader, rootMargin: '1200px 0px', threshold: 0 })
    pageElements.forEach(element => nearPages.observe(element))
    const current = new IntersectionObserver(entries => {
      for (const entry of entries) if (entry.isIntersecting) {
        currentPage = Number(entry.target.dataset.page)
        pageSelect.value = String(currentPage)
      }
    }, { root: reader, rootMargin: '-5% 0px -75% 0px', threshold: 0 })
    pageElements.forEach(element => current.observe(element))
    const requested = /^#page-(\d+)$/.exec(location.hash)
    if (requested) requestAnimationFrame(() => jumpToPage(Math.min(manifest.pageCount - 1, Math.max(0, Number(requested[1]) - 1))))
  } catch {
    status.className = 'status'
    status.replaceChildren(document.createTextNode('项目暂时无法加载，请使用顶部「原 PDF」查看完整文件。'))
  }
}
openProject()
    </script>
